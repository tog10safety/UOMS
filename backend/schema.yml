          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedFlightCrewAssignment'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlightCrewAssignment'
          description: ''
    delete:
      operationId: api_v1_aircraft_crew_assignments_destroy
      description: Direct CRUD for crew assignments (in addition to the nested /flights/{id}/crew/
