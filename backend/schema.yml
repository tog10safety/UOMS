          type: string
          format: uuid
        description: A UUID string identifying this flight crew assignment.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/aircraft/flights/:
    get:
      operationId: api_v1_aircraft_flights_list
      description: |-
        Flight scheduling and departure/arrival monitoring.

        AOR unit visibility is enforced by UnitScopedQuerysetMixin: a user's
        unit determines which flights they see, unless their role grants
        cross-AOR visibility (ADMIN/COMMANDER).
      parameters:
      - in: query
        name: aircraft
        schema:
          type: string
          format: uuid
      - in: query
        name: mission
        schema:
          type: string
          format: uuid
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ARRIVED
          - CANCELLED
          - DELAYED
          - DEPARTED
          - EN_ROUTE
          - SCHEDULED
        description: |-
          * `SCHEDULED` - Scheduled
          * `DEPARTED` - Departed
          * `EN_ROUTE` - En Route
          * `ARRIVED` - Arrived
          * `DELAYED` - Delayed
          * `CANCELLED` - Cancelled
      - in: query
        name: unit
        schema:
          type: string
          format: uuid
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFlightListList'
          description: ''
    post:
      operationId: api_v1_aircraft_flights_create
      description: |-
        Flight scheduling and departure/arrival monitoring.

        AOR unit visibility is enforced by UnitScopedQuerysetMixin: a user's
        unit determines which flights they see, unless their role grants
        cross-AOR visibility (ADMIN/COMMANDER).
      tags:
      - api
      requestBody:
