openapi: 3.0.3
info:
  title: UOMS API
  version: 1.0.0
  description: Unit Operations Management System — REST API
paths:
  /api/v1/aircraft/crew-assignments/:
    get:
      operationId: api_v1_aircraft_crew_assignments_list
      description: Direct CRUD for crew assignments (in addition to the nested /flights/{id}/crew/
        action).
      parameters:
      - in: query
        name: crew_role
        schema:
          type: string
          enum:
          - CO_PILOT
          - CREW_CHIEF
          - FLIGHT_ENGINEER
          - LOADMASTER
          - OTHER
          - PIC
        description: |-
          * `PIC` - Pilot in Command
          * `CO_PILOT` - Co-Pilot
          * `FLIGHT_ENGINEER` - Flight Engineer
          * `LOADMASTER` - Loadmaster
          * `CREW_CHIEF` - Crew Chief
          * `OTHER` - Other
      - in: query
        name: flight
        schema:
          type: string
          format: uuid
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: personnel
        schema:
          type: string
          format: uuid
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFlightCrewAssignmentList'
          description: ''
    post:
      operationId: api_v1_aircraft_crew_assignments_create
      description: Direct CRUD for crew assignments (in addition to the nested /flights/{id}/crew/
        action).
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlightCrewAssignment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FlightCrewAssignment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FlightCrewAssignment'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlightCrewAssignment'
          description: ''
  /api/v1/aircraft/crew-assignments/{id}/:
    get:
      operationId: api_v1_aircraft_crew_assignments_retrieve
      description: Direct CRUD for crew assignments (in addition to the nested /flights/{id}/crew/
        action).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this flight crew assignment.
        required: true
      tags:
      - api
      security:
