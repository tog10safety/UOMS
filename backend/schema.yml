  /api/v1/gis/overlay/:
    get:
      operationId: api_v1_gis_overlay_retrieve
      description: |-
        Aggregates every GIS layer plus live vehicle/mission/aircraft positions
        into one payload for the Operational Mapping screen — AOR boundaries,
        checkpoints, landing zones, hazards, routes, and unit positions, each
        with MGRS coordinates computed alongside lat/lng.

        Note: this aggregation endpoint is not yet unit-scoped — it currently
        returns all units' data to any authenticated viewer. Per-module
        ViewSets (AORBoundaryViewSet etc.) ARE unit-scoped; scoping this
        combined view the same way is a follow-up (it would need each of the
        six queries below filtered by request.user.unit_id individually).
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/gis/routes/:
    get:
      operationId: api_v1_gis_routes_list
      description: |-
        Restricts list/retrieve results to the requesting user's unit AND every
        unit subordinate to it in the echelon hierarchy (HPAF > Command > Wing >
        Group > Squadron) — a "mother unit" user sees its own records plus every
        unit beneath it, per Unit.get_descendant_ids(). Bypassed entirely for
        ADMIN/COMMANDER/superuser, who see all units. Subclasses set:

            unit_field = 'unit'  # the queryset lookup path to a Unit FK,
                                  # e.g. 'assigned_driver__unit' if the model
                                  # itself has no direct unit field.

        A user with no unit assigned and no cross-unit role sees an empty
        queryset rather than everything — fail closed, not open.
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: route_type
        schema:
          type: string
          enum:
          - EVACUATION
          - OTHER
          - PATROL
          - SUPPLY
        description: |-
          * `SUPPLY` - Main Supply Route
          * `PATROL` - Patrol Route
          * `EVACUATION` - Evacuation Route
          * `OTHER` - Other
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: unit
        schema:
          type: string
          format: uuid
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRouteList'
          description: ''
