            schema:
              $ref: '#/components/schemas/FlightDetail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FlightDetail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FlightDetail'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlightDetail'
          description: ''
