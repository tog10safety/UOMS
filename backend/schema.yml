components:
  schemas:
    AORBoundary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 150
        unit:
          type: string
          format: uuid
          nullable: true
        unit_name:
          type: string
          readOnly: true
        boundary:
          type: string
          readOnly: true
        boundary_input:
          type: array
          items: {}
          writeOnly: true
        color:
          type: string
          description: Hex color for map rendering.
          maxLength: 20
        description:
          type: string
        is_active:
          type: boolean
          description: Soft-delete flag.
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - boundary
      - created_at
      - id
      - name
      - unit_name
    ActionEnum:
      enum:
      - SUBMITTED
      - APPROVED
      - REJECTED
      - REOPENED
      type: string
      description: |-
        * `SUBMITTED` - Submitted for Approval
        * `APPROVED` - Approved
        * `REJECTED` - Rejected
        * `REOPENED` - Reopened for Revision
    Aircraft:
      type: object
      properties:
        id:
          type: string
          format: uuid
