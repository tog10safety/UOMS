  /api/v1/aircraft/registry/:
    get:
      operationId: api_v1_aircraft_registry_list
      description: |-
        Mixin for ViewSets: declares `permission_module` and applies
        HasModulePermission automatically. Subclasses only need to set:

            permission_module = Module.VEHICLES
            action_permission_map = {'dispatch': Action.DISPATCH}  # optional, for custom @action methods

        Unit/section-based queryset scoping is applied by UnitScopedQuerysetMixin
        (see below) — combine both mixins on views that need row-level scoping.
      parameters:
      - in: query
        name: base_unit
        schema:
          type: string
          format: uuid
      - in: query
        name: flying_status
        schema:
          type: string
          enum:
          - GROUNDED
          - IN_FLIGHT
          - MAINTENANCE
          - SCHEDULED
        description: |-
          * `GROUNDED` - Grounded
          * `SCHEDULED` - Scheduled
          * `IN_FLIGHT` - In Flight
          * `MAINTENANCE` - Under Maintenance
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
