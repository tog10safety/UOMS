# Throw-away PostgreSQL + PostGIS for running the UOMS/MRM test-suite exactly as production would.
#   docker compose -f docker-compose.postgis.yml up -d
#   (see apps/mrm/README_MRM.md → "Running the tests on PostgreSQL")
services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: uoms
      POSTGRES_USER: uoms
      POSTGRES_PASSWORD: uoms_test_password   # local test database only — never reuse in production
    ports:
      - "5433:5432"       # 5433 so it does not collide with a local PostgreSQL on 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uoms -d uoms"]
      interval: 3s
      timeout: 3s
      retries: 20
